services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: dev_user       # 👈 Username mặc định
      POSTGRES_PASSWORD: dev_pass   # 👈 Password mặc định
      POSTGRES_DB: dev_db           # 👈 Database mặc định
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user -d dev_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data: